<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pinsetter 2048</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#14161c;color:#e8e6df;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;
       user-select:none;-webkit-user-select:none}
  #hud{width:min(94vw,480px);display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 4px;font-size:13px;color:#9aa0ab}
  #hud b{font-size:18px;color:#fff;margin-left:4px}
  #hint{width:min(94vw,480px);text-align:center;font-size:12.5px;color:#9aa0ab;min-height:18px;padding-bottom:6px}
  #wrap{position:relative}
  canvas{display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:none;cursor:crosshair}
  #foot{width:min(94vw,480px);text-align:center;font-size:11.5px;color:#6b7280;padding:8px 0 14px;line-height:1.5}
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
           background:rgba(10,12,16,.8);border-radius:10px;text-align:center;gap:10px;padding:20px}
  #overlay h1{font-size:34px;letter-spacing:1px}
  #overlay p{color:#c9ccd4;font-size:15px;max-width:320px;line-height:1.5}
  #overlay button{margin-top:8px;padding:10px 22px;font-size:15px;border:0;border-radius:8px;
                  background:#ffb020;color:#221a05;font-weight:700;cursor:pointer}
  #overlay button.ghost{background:transparent;color:#c9ccd4;border:1px solid #555b66;margin-left:8px}
</style>
</head>
<body>
<div id="hud">
  <div>Frame<b id="frame">1</b></div>
  <div>Score<b id="score">0</b></div>
  <div>Best<b id="best">0</b></div>
</div>
<div id="hint"></div>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1 id="ovTitle"></h1>
    <p id="ovText"></p>
    <div>
      <button id="ovBtn">New game</button>
      <button id="ovKeep" class="ghost" style="display:none">Keep rolling</button>
    </div>
  </div>
</div>
<div id="foot">Same-value pins that touch merge &times;2. Guttered pins are swept up by the pinsetter and
re-loaded next frame, along with one fresh 2-pin. Build a 2048 pin to win.</div>

<script>
"use strict";
// ---------------- constants ----------------
const W=480,H=760,GUTTER=26,LANE_L=80,LANE_R=W-80,TOP_Y=96;
const PIN_R=15,BALL_R=17,MAXV=14,BALL_START={x:W/2,y:H-84};
const TIER={2:'#8f9aa8',4:'#4f8ef7',8:'#3ecf6e',16:'#ffb020',32:'#ff7a45',64:'#ff4d6d',
            128:'#c084fc',256:'#7dd3fc',512:'#fde047',1024:'#fb923c'};
const tierColor=v=>TIER[v]||'#ffd700';

// ---------------- canvas ----------------
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
function fit(){
  const dpr=window.devicePixelRatio||1;
  const s=Math.min(window.innerWidth*0.94/W,(window.innerHeight-150)/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',fit);fit();

// ---------------- state ----------------
let pins=[],ball=null,gutterAnim=[],gutterBall=null,reloadQueue=[];
let phase='aiming',psT=0,rollFrames=0,placementFailed=false;
let score=0,frame=1,best=+(localStorage.getItem('pinsetter2048_best')||0);
let floaters=[],pops=[],aim=null;
const el=id=>document.getElementById(id);
function hud(){el('frame').textContent=frame;el('score').textContent=score;el('best').textContent=Math.max(best,score);}
function setHint(t){el('hint').textContent=t;}

// ---------------- helpers ----------------
function newPin(x,y,value){return{x,y,vx:0,vy:0,r:PIN_R,m:1,value,mergeCd:45,dropT:1};}
function findFreeSpot(){
  let bestP=null,bestD=-99;
  for(let i=0;i<90;i++){
    const x=LANE_L+PIN_R+6+Math.random()*(LANE_R-LANE_L-2*PIN_R-12);
    const y=TOP_Y+PIN_R+12+Math.random()*230;
    let dmin=1e9;
    for(const p of pins)dmin=Math.min(dmin,Math.hypot(p.x-x,p.y-y)-2*PIN_R);
    if(dmin>6)return{x,y};
    if(dmin>bestD){bestD=dmin;bestP={x,y};}
  }
  return bestD>0?bestP:null;
}
function toast(x,y,text,color){floaters.push({x,y,text,color:color||'#fff',age:0});}

// ---------------- physics ----------------
function collide(a,b,rest){
  const dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r;
  let d=Math.hypot(dx,dy);if(d===0)d=0.01;
  if(d<min){
    const nx=dx/d,ny=dy/d,overlap=min-d,tm=a.m+b.m;
    a.x-=nx*overlap*(b.m/tm);a.y-=ny*overlap*(b.m/tm);
    b.x+=nx*overlap*(a.m/tm);b.y+=ny*overlap*(a.m/tm);
    const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(vn<0){
      const j=-(1+rest)*vn/(1/a.m+1/b.m);
      a.vx-=j*nx/a.m;a.vy-=j*ny/a.m;
      b.vx+=j*nx/b.m;b.vy+=j*ny/b.m;
    }
  }
}
function stepMerges(){
  for(let guard=0;guard<12;guard++){
    let merged=false;
    outer:
    for(let i=0;i<pins.length;i++)for(let j=i+1;j<pins.length;j++){
      const a=pins[i],b=pins[j];
      if(a.value!==b.value||a.mergeCd>0||b.mergeCd>0)continue;
      if(Math.hypot(a.x-b.x,a.y-b.y)<2*PIN_R+1){ // touching (or overlapping) = merge
        const nv=a.value*2;
        pins.splice(j,1);pins.splice(i,1);
        const np=newPin((a.x+b.x)/2,(a.y+b.y)/2,nv);
        np.vx=(a.vx+b.vx)/2;np.vy=(a.vy+b.vy)/2;np.mergeCd=30;
        pins.push(np);
        score+=nv;hud();
        pops.push({x:np.x,y:np.y,age:0});
        toast(np.x,np.y-24,'+'+nv,tierColor(nv));
        merged=true;
        if(nv>=2048){win();return;}
        break outer;
      }
    }
    if(!merged)break;
  }
}
function stepPhysics(){
  // integrate + friction
  if(ball){
    ball.x+=ball.vx;ball.y+=ball.vy;
    const s=Math.hypot(ball.vx,ball.vy);
    if(s<0.08){ball.vx=0;ball.vy=0;}else{ball.vx*=0.991;ball.vy*=0.991;}
  }
  for(const p of pins){
    p.x+=p.vx;p.y+=p.vy;
    const s=Math.hypot(p.vx,p.vy);
    if(s<0.04){p.vx=0;p.vy=0;}else{p.vx*=0.983;p.vy*=0.983;}
  }
  // walls (back of lane + bottom)
  const wall=(o,r)=>{
    if(o.y<TOP_Y+r){o.y=TOP_Y+r;o.vy=-o.vy*0.55;}
    if(o.y>H-14-r){o.y=H-14-r;o.vy=-o.vy*0.5;}
  };
  if(ball)wall(ball,BALL_R);
  for(const p of pins)wall(p,PIN_R);
  // guttering
  if(ball&&(ball.x<LANE_L-BALL_R*0.3||ball.x>LANE_R+BALL_R*0.3)){
    gutterBall={x:ball.x,y:ball.y,dir:ball.x<W/2?-1:1,age:0};
    ball=null;toast(W/2,H-150,'Gutter!','#ff6b6b');
  }
  for(let i=pins.length-1;i>=0;i--){
    const p=pins[i];
    if(p.x<LANE_L-PIN_R*0.5||p.x>LANE_R+PIN_R*0.5){
      gutterAnim.push({x:p.x,y:p.y,value:p.value,age:0});
      pins.splice(i,1);
    }
  }
  // collisions
  if(ball)for(const p of pins)collide(ball,p,0.92);
  for(let i=0;i<pins.length;i++)for(let j=i+1;j<pins.length;j++)collide(pins[i],pins[j],0.85);
  stepMerges();
}
function checkRollEnd(){
  rollFrames++;
  const ballDone=!ball||Math.hypot(ball.vx,ball.vy)<0.08;
  const pinsDone=pins.every(p=>Math.hypot(p.vx,p.vy)<0.04);
  if((ballDone&&pinsDone)||rollFrames>1000){
    if(ball){ball.vx=0;ball.vy=0;}
    for(const p of pins){p.vx=0;p.vy=0;}
    beginPinset();
  }
}

// ---------------- pinsetter phase ----------------
function beginPinset(){
  phase='pinsetting';psT=0;placementFailed=false;
  reloadQueue=gutterAnim.map(g=>({value:g.value,done:false}));
  reloadQueue.push({value:2,done:false}); // one fresh pin from the machine
  setHint('Pinsetter sweeping & loading…');
}
function stepPinset(){
  psT++;
  for(const g of gutterAnim)g.age++;
  gutterAnim=gutterAnim.filter(g=>g.age<34);
  if(gutterBall){gutterBall.age++;if(gutterBall.age>20)gutterBall=null;}
  reloadQueue.forEach((q,i)=>{
    if(!q.done&&psT>=26+i*9){
      const spot=findFreeSpot();
      if(!spot){placementFailed=true;q.done=true;return;}
      const p=newPin(spot.x,spot.y,q.value);p.dropT=0;p.mergeCd=50;
      pins.push(p);q.done=true;
    }
  });
  if(psT>26+reloadQueue.length*9+18){
    if(placementFailed)gameOver();
    else{
      frame++;
      ball={x:BALL_START.x,y:BALL_START.y,vx:0,vy:0,r:BALL_R,m:6};
      phase='aiming';hud();setHint('Drag from the ball and release to roll');
    }
  }
}

// ---------------- game flow ----------------
function win(){
  phase='won';best=Math.max(best,score);
  localStorage.setItem('pinsetter2048_best',best);hud();
  showOverlay('STRIKE! 🎳','You rolled a 2048 pin — score '+score+' in frame '+frame+'.',true);
}
function gameOver(){
  phase='over';best=Math.max(best,score);
  localStorage.setItem('pinsetter2048_best',best);hud();
  showOverlay('Lane jammed','The pinsetter can\u2019t load more pins. Score '+score+' over '+frame+' frames.',false);
}
function showOverlay(title,text,canKeep){
  el('ovTitle').textContent=title;el('ovText').textContent=text;
  el('ovKeep').style.display=canKeep?'':'none';
  el('overlay').style.display='flex';
}
function reset(){
  pins=[];ball={x:BALL_START.x,y:BALL_START.y,vx:0,vy:0,r:BALL_R,m:6};
  gutterAnim=[];gutterBall=null;reloadQueue=[];floaters=[];pops=[];aim=null;
  score=0;frame=1;phase='aiming';placementFailed=false;psT=0;rollFrames=0;
  for(const [x,y] of [[W/2,TOP_Y+70],[W/2-46,TOP_Y+118],[W/2+46,TOP_Y+118]])pins.push(newPin(x,y,2));
  hud();el('overlay').style.display='none';setHint('Drag from the ball and release to roll');
}
el('ovBtn').addEventListener('click',reset);
el('ovKeep').addEventListener('click',()=>{
  el('overlay').style.display='none';
  ball={x:BALL_START.x,y:BALL_START.y,vx:0,vy:0,r:BALL_R,m:6};
  phase='aiming';setHint('Drag from the ball and release to roll');
});

// ---------------- input (slingshot aim) ----------------
function ptr(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{
  if(phase!=='aiming'||!ball)return;
  aim={power:0};cv.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove',e=>{
  if(!aim||phase!=='aiming'||!ball)return;
  const p=ptr(e),dx=ball.x-p.x,dy=ball.y-p.y,len=Math.hypot(dx,dy);
  if(len<6){aim.power=0;return;}
  aim.dx=dx/len;aim.dy=dy/len;aim.power=Math.min(1,len/170);
});
window.addEventListener('pointerup',()=>{
  const a=aim;aim=null;
  if(phase==='aiming'&&a&&a.power>0.12&&ball){
    ball.vx=a.dx*a.power*MAXV;ball.vy=a.dy*a.power*MAXV;
    phase='rolling';rollFrames=0;setHint('Rolling…');
  }
});

// ---------------- drawing ----------------
function drawPin(x,y,value,scale,alpha){
  const r=PIN_R*scale;
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(2,3,r,r*0.95,0,0,7);ctx.fill();
  ctx.fillStyle='#f6f3ea';
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=tierColor(value);ctx.stroke();
  ctx.lineWidth=2.5;ctx.strokeStyle='#d64545';
  ctx.beginPath();ctx.arc(0,0,r-4,-2.4,-0.7);ctx.stroke();
  ctx.fillStyle='#2a2d33';
  const fs=value<100?15:value<1000?12:9;
  ctx.font='bold '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(value,0,1);
  ctx.restore();
}
function drawBall(b,alpha){
  ctx.save();ctx.translate(b.x,b.y);ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(2,3,BALL_R,BALL_R*0.95,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(-5,-6,4,0,0,BALL_R);
  g.addColorStop(0,'#4a5160');g.addColorStop(1,'#20242c');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,BALL_R,0,7);ctx.fill();
  ctx.fillStyle='#111419';
  for(const [hx,hy] of [[-3,-4],[3,-5],[0,1]]){ctx.beginPath();ctx.arc(hx,hy,2.2,0,7);ctx.fill();}
  ctx.restore();
}
function draw(){
  // floor + gutters
  ctx.fillStyle='#171a20';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0b0d11';
  ctx.fillRect(LANE_L-GUTTER,0,GUTTER,H);ctx.fillRect(LANE_R,0,GUTTER,H);
  // lane wood
  const g=ctx.createLinearGradient(LANE_L,0,LANE_R,0);
  g.addColorStop(0,'#c89a5b');g.addColorStop(.5,'#dcb273');g.addColorStop(1,'#c89a5b');
  ctx.fillStyle=g;ctx.fillRect(LANE_L,TOP_Y-6,LANE_R-LANE_L,H-TOP_Y+6);
  ctx.strokeStyle='rgba(120,80,30,.22)';ctx.lineWidth=1;
  for(let x=LANE_L+20;x<LANE_R;x+=20){ctx.beginPath();ctx.moveTo(x,TOP_Y);ctx.lineTo(x,H);ctx.stroke();}
  // aiming arrows
  ctx.fillStyle='rgba(140,60,30,.5)';
  for(let i=-3;i<=3;i++){
    const ax=W/2+i*40,ay=H*0.45-(i===0?16:Math.abs(i)===1?8:0);
    ctx.beginPath();ctx.moveTo(ax,ay-10);ctx.lineTo(ax-7,ay+8);ctx.lineTo(ax+7,ay+8);ctx.closePath();ctx.fill();
  }
  // foul line
  ctx.strokeStyle='#c0392b';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(LANE_L,H-56);ctx.lineTo(LANE_R,H-56);ctx.stroke();
  // pinsetter machine
  const active=phase==='pinsetting';
  ctx.fillStyle=active?'#3a4150':'#262b34';
  ctx.fillRect(LANE_L-GUTTER,14,GUTTER*2+(LANE_R-LANE_L),TOP_Y-14);
  ctx.fillStyle='#1c2027';
  for(let x=LANE_L+16;x<LANE_R;x+=32){ctx.beginPath();ctx.arc(x,60,9,0,7);ctx.fill();}
  ctx.fillStyle=active?'#ffd76a':'#8b93a1';
  ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText('P I N S E T T E R',W/2,34);
  if(active){
    const t=Math.min(1,Math.max(0,(psT-14)/46));
    if(t>0&&t<1){
      const sx=LANE_L+8+t*(LANE_R-LANE_L-16);
      ctx.fillStyle='rgba(255,215,106,.85)';
      ctx.fillRect(sx-3,TOP_Y-4,6,26);
    }
  }
  // guttered pins fading out
  for(const gp of gutterAnim){
    const slide=gp.age*(gp.x<W/2?-1.5:1.5); // slide toward its gutter
    drawPin(gp.x+slide,gp.y,gp.value,1,Math.max(0,1-gp.age/34));
  }
  if(gutterBall)drawBall({x:gutterBall.x+gutterBall.dir*gutterBall.age*2,y:gutterBall.y},Math.max(0,1-gutterBall.age/20));
  // pins
  for(const p of pins)drawPin(p.x,p.y,p.value,0.5+0.5*p.dropT);
  // ball + aim
  if(ball){
    drawBall(ball);
    if(phase==='aiming'&&aim&&aim.power>0){
      const len=40+aim.power*150;
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.setLineDash([6,8]);
      ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+aim.dx*len,ball.y+aim.dy*len);ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle='hsl('+Math.round(120*(1-aim.power))+',85%,55%)';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R+7,-Math.PI/2,-Math.PI/2+aim.power*Math.PI*2);ctx.stroke();
    }
  }
  // merge pops
  for(const p of pops){
    p.age++;
    ctx.globalAlpha=Math.max(0,1-p.age/22);
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,PIN_R+p.age*1.4,0,7);ctx.stroke();
  }
  pops=pops.filter(p=>p.age<22);
  // floating score text
  for(const f of floaters){
    f.age++;
    ctx.globalAlpha=Math.max(0,1-f.age/55);
    ctx.fillStyle=f.color;ctx.font='bold 16px system-ui';ctx.textAlign='center';
    ctx.fillText(f.text,f.x,f.y-f.age*0.6);
  }
  floaters=floaters.filter(f=>f.age<55);
  ctx.globalAlpha=1;
}

// ---------------- main loop ----------------
function settleAim(){
  // keep touching same-value pins merged even between rolls
  for(let i=0;i<pins.length;i++)for(let j=i+1;j<pins.length;j++)collide(pins[i],pins[j],0.5);
  stepMerges();
}
function agePins(){
  // drop-in scale + merge cooldown tick in every phase, not just while rolling
  for(const p of pins){
    if(p.mergeCd>0)p.mergeCd--;
    if(p.dropT<1)p.dropT=Math.min(1,p.dropT+0.12);
  }
}
function tick(){
  if(phase==='rolling'){stepPhysics();if(phase==='rolling')checkRollEnd();}
  else if(phase==='pinsetting')stepPinset();
  else if(phase==='aiming')settleAim();
  agePins();
  draw();
  requestAnimationFrame(tick);
}
reset();
requestAnimationFrame(tick);
</script>
</body>
</html>
